version: 2.1

orbs:
  codecov: codecov/codecov@6.0.0

jobs:
  build:
    working_directory: ~/testmonitor/laravel-accountable

    docker:
      - image: cimg/php:8.4

    steps:
      - run:
          name: Update Composer
          command: sudo composer self-update
      - checkout
      - run:
          name: Install Composer Dependencies
          command: composer install -n
      - persist_to_workspace:
          root: .
          paths:
            - .

  code_analysis:
    working_directory: ~/testmonitor/laravel-accountable

    docker:
      - image: cimg/php:8.4

    steps:
      - attach_workspace:
          at: .
      - run:
          name: Pint
          command: |
            mkdir -p ./logs/pint
            vendor/bin/pint --test --format=junit > logs/pint/junit.xml
      - run:
          name: PHPCS
          command: |
            mkdir -p ./logs/phpcs
            vendor/bin/phpcs -v --report=junit --report-file=logs/phpcs/junit.xml src/
      - run:
          name: Rector
          command: |
            mkdir -p ./logs/rector
            vendor/bin/rector process --dry-run --no-ansi --no-progress-bar --rules-summary > logs/rector/rector.log
      - run:
          name: PHPStan
          command: |
            mkdir -p ./logs/phpstan
            vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=junit > logs/phpstan/junit.xml

      - store_artifacts:
          path: ./logs/pint
          destination: pint
      - store_artifacts:
          path: ./logs/phpcs
          destination: phpcs
      - store_test_results:
          path: ./logs

  unit_test:
    working_directory: ~/testmonitor/laravel-accountable

    docker:
      - image: cimg/php:8.4

    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install PCOV
          command: |
            sudo apt-get update
            sudo apt install php-common
            sudo pecl install pcov
      - run:
          name: Run Unit Tests
          command: |
            mkdir -p ./logs/phpunit
            vendor/bin/phpunit -d memory_limit=1G --coverage-clover coverage.xml --log-junit logs/phpunit/junit.xml --testdox-html logs/phpunit/testdox.html
      - store_artifacts:
          path: ./logs/phpunit
          destination: phpunit
      - store_test_results:
          path: ./logs
      - codecov/upload:
          report_type: coverage
      - codecov/upload:
          report_type: test_results
          files: logs/phpunit/junit.xml

workflows:
  build_analyze_test:
    jobs:
      - build
      - code_analysis:
          requires:
            - build
      - unit_test:
          requires:
            - code_analysis